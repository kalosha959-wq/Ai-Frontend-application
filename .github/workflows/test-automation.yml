# AI Story Studio Test Automation

name: Comprehensive Testing Suite

on:
  push:
    branches: [ main, ai-story-studio-backend, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [18.x, 20.x]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start test server
      run: |
        # Set demo mode for testing
        echo "GEMINI_API_KEY=demo-mode" > .env
        echo "GCP_PROJECT_ID=demo-project" >> .env
        echo "GCP_LOCATION=us-central1" >> .env
        echo "PORT=3000" >> .env
        npm start &
        sleep 10
      env:
        NODE_ENV: test
        
    - name: Wait for server to be ready
      run: |
        timeout 60 bash -c 'until curl -fsS -X POST http://localhost:3000/generate-video-plan -H "Content-Type: application/json" -d "{\"prompt\":\"CI healthcheck\",\"duration\":\"5\"}"; do sleep 2; done'
        
    - name: Run Simple Button Tests
      run: node simple-button-test.js
      continue-on-error: true
      
    - name: Run Enhanced Test Suite
      run: node enhanced-test-suite.js
      continue-on-error: true
      
    - name: Run Browser Tests (Puppeteer)
      run: node test-buttons.js
      continue-on-error: true
      env:
        PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: false
        
    - name: Upload test reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-reports-node-${{ matrix.node-version }}
        path: |
          button-test-report.json
          enhanced-test-report.json
          test-screenshots/
        retention-days: 30
        
    - name: Test Report Summary
      if: always()
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        if [ -f enhanced-test-report.json ]; then
          node -e "
            const report = require('./enhanced-test-report.json');
            console.log('### Enhanced Test Suite');
            console.log('- **Total Tests:** ' + report.summary.total);
            console.log('- **Passed:** ' + report.summary.passed);
            console.log('- **Failed:** ' + report.summary.failed);
            console.log('- **Success Rate:** ' + report.summary.successRate + '%');
            console.log('');
            Object.entries(report.categories).forEach(([key, cat]) => {
              console.log('**' + cat.name + ':** ' + cat.passed + '/' + cat.total + ' passed');
            });
          " >> $GITHUB_STEP_SUMMARY
        fi
        
  security-scan:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Run security audit
      run: npm audit --audit-level moderate
      continue-on-error: true
      
    - name: Check for vulnerabilities
      run: |
        npm audit --json > audit-report.json || true
        if [ -f audit-report.json ]; then
          node -e "
            const audit = require('./audit-report.json');
            if (audit.metadata && audit.metadata.vulnerabilities) {
              const vulns = audit.metadata.vulnerabilities;
              const total = vulns.info + vulns.low + vulns.moderate + vulns.high + vulns.critical;
              console.log('Security Vulnerabilities Found: ' + total);
              if (vulns.high > 0 || vulns.critical > 0) {
                console.log('High/Critical vulnerabilities detected!');
                process.exit(1);
              }
            }
          "
        fi
        
  performance-test:
    runs-on: ubuntu-latest
    needs: test
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Start server for performance testing
      run: |
        echo "GEMINI_API_KEY=demo-mode" > .
        echo "GCP_PROJECT_ID=demo-project" >> .
        echo "GCP_LOCATION=us-central1" >> .
        echo "PORT=3000" >> .
        npm start &
        sleep 10
        
    - name: Install Lighthouse CI
      run: npm install -g @lhci/cli@0.12.x
      
    - name: Run Lighthouse CI (with GitHub token)
      env:
        LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
      run: |
        if [ -n "$LHCI_GITHUB_APP_TOKEN" ]; then
          echo "Running Lighthouse CI with GitHub integration..."
          lhci autorun --upload.target=temporary-public-storage
        else
          echo "LHCI_GITHUB_APP_TOKEN not set; skipping Lighthouse CI run"
        fi
     
    - name: Upload Lighthouse reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: lighthouse-reports
        path: lighthouse-reports/
        retention-days: 30
        
  deploy-staging:
    runs-on: ubuntu-latest
    needs: [test, security-scan]
    if: github.ref == 'refs/heads/ai-story-studio-backend' && github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Deploy to staging
      run: |
        echo "Deploying to staging environment..."
        # Add your staging deployment commands here
        echo "Staging deployment would occur here"
        
  deploy-production:
    runs-on: ubuntu-latest
    needs: [test, security-scan, performance-test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Deploy to production
      run: |
        echo "Deploying to production environment..."
        # Add your production deployment commands here
        echo "Production deployment would occur here"
