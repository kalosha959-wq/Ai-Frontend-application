name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci
      - name: Run format check
        run: npx prettier --check . || true
      - name: Start server (demo mode)
        env:
          GEMINI_API_KEY: demo-mode
          GCP_PROJECT_ID: demo-project
        run: |
          npm start &
          sleep 3
      - name: Run lint
        run: npx eslint . || true
      - name: Run unit tests
        run: npm test
      - name: Run UI tests
        run: node test-buttons.js
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.json
